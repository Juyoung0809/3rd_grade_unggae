name: Deploy to EC2

on:
  push:
    branches: [ P3 ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 600s
          script: |
            cd ~/3rd_grade_unggae
            git pull origin P3
            DOCKER_BUILDKIT=0 docker-compose up -d --build
            docker-compose ps

            echo "백엔드 헬스체크 대기 중..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost/actuator/health | grep -q '"status":"UP"'; then
                echo "백엔드 헬스체크 성공"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "백엔드 헬스체크 실패"
                docker-compose logs --tail=50 backend
                exit 1
              fi
              sleep 5
            done

            echo "프론트엔드 헬스체크 확인 중..."
            if curl -sf -o /dev/null http://localhost/; then
              echo "프론트엔드 헬스체크 성공"
            else
              echo "프론트엔드 헬스체크 실패"
              docker-compose logs --tail=50 frontend
              exit 1
            fi
