name: Deploy to EC2

on:
  push:
    branches: [ P3 ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 600s
          script: |
            cd ~/3rd_grade_unggae
            git pull origin P3
            DOCKER_BUILDKIT=0 docker-compose up -d --build
            docker-compose ps
