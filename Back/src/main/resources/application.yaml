server:
  port: 8080

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: unggae
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

file:
  upload-dir: ./uploads/videos

toss:
  client-key: ${TOSS_CLIENT_KEY:test_ck_placeholder}
  secret-key: ${TOSS_SECRET_KEY:test_sk_placeholder}
  api-url: https://api.tosspayments.com/v1


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: EditHub
    version: 1.0.0
    description: 영상 편집 전문 온라인 강의 플랫폼

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
